doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        auto_mapping: false
        mappings:
            Episode:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Episode/Persistence/Doctrine/Mapping'
                prefix: 'App\Infrastructure\Episode\Persistence\Doctrine\Projection'
                alias: Episode
            IncomingEvent:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/IncomingEvent/Persistence/Doctrine/Mapping'
                prefix: 'App\Infrastructure\IncomingEvent\Persistence\Doctrine\Projection'
                alias: IncomingEvent



when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
